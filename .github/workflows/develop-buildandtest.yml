name: Development dotnet build and test

# Runs on every pull request into development or main, on pushes to development, and on demand.
# It builds all target frameworks, runs the unit tests and packs the NuGet packages so packaging
# problems surface long before a release. It publishes nothing.

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test and pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          # 8.x builds every target framework in the solution. 6.x is only needed to run the
          # net6.0 unit test projects.
          dotnet-version: |
            6.x
            8.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: test-results
          path: TestResults

      - name: Pack
        run: dotnet pack --configuration Release --no-build --output artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/packages
